<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Viz</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; overflow: hidden; height: 100vh; }
#app { display: flex; flex-direction: column; height: 100vh; }
header { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1.5rem; background: #161b22; border-bottom: 1px solid #30363d; }
header h1 { font-size: 1.2rem; font-weight: 600; color: #58a6ff; }
.tabs { display: flex; gap: 0.25rem; }
.tab { padding: 0.4rem 1rem; border: 1px solid #30363d; border-radius: 6px; cursor: pointer; font-size: 0.85rem; background: #21262d; color: #8b949e; }
.tab:hover { background: #30363d; color: #c9d1d9; }
.tab.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
#main { flex: 1; display: flex; position: relative; overflow: hidden; }
#viz { flex: 1; position: relative; }
#viz svg { width: 100%; height: 100%; }
#panel { width: 320px; background: #161b22; border-left: 1px solid #30363d; padding: 1rem; overflow-y: auto; display: none; }
#panel h3 { margin-bottom: 0.5rem; color: #58a6ff; }
#panel p { font-size: 0.85rem; margin-bottom: 0.3rem; color: #8b949e; }
#panel .sym { padding: 0.25rem 0; border-bottom: 1px solid #21262d; font-size: 0.85rem; }
#panel .sym .kind { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 0.75rem; background: #21262d; margin-right: 6px; color: #7ee787; }
.legend { position: absolute; bottom: 1rem; left: 1rem; display: flex; gap: 1rem; font-size: 0.75rem; background: #161b22b3; padding: 0.4rem 0.8rem; border-radius: 6px; }
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-color { width: 12px; height: 12px; border-radius: 2px; }
.tooltip { position: absolute; pointer-events: none; background: #161b22; border: 1px solid #30363d; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; opacity: 0; transition: opacity 0.15s; }
.node-label { pointer-events: none; font-size: 10px; fill: #8b949e; }
.link { stroke: #30363d; stroke-opacity: 0.4; }
.node circle { cursor: pointer; stroke: #fff; stroke-width: 1.5; }
.node:hover circle { stroke: #58a6ff; stroke-width: 2.5; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #8b949e; background: #0d1117; z-index: 10; }
#loading.hidden { display: none; }
.treemap-cell { stroke: #161b22; stroke-width: 1; cursor: pointer; }
.treemap-label { font-size: 10px; fill: #fff; pointer-events: none; }
.heatmap-rect { stroke: #161b22; stroke-width: 1; cursor: pointer; }
.heatmap-label { font-size: 11px; fill: #c9d1d9; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Hermes Viz</h1>
    <div class="tabs">
      <div class="tab active" data-view="graph">Dependency Graph</div>
      <div class="tab" data-view="heatmap">Blast Heatmap</div>
      <div class="tab" data-view="treemap">Module Treemap</div>
    </div>
  </header>
  <div id="main">
    <div id="viz"><div id="loading">Loading graph data...</div></div>
    <div id="panel"><h3 id="panel-title">Node Detail</h3><div id="panel-content"></div></div>
  </div>
  <div id="tooltip" class="tooltip"></div>
</div>
<script>
// ─── State ──────────────────────────────────────────────────────────
let graphData = { nodes: [], edges: [] };
let blastData = [];
let currentView = 'graph';
let selectedNodeId = null;

// ─── Color scales ────────────────────────────────────────────────────
const riskColor = d3.scaleLinear()
  .domain([0, 5, 15])
  .range(['#3fb950', '#d29922', '#f85149'])
  .interpolate(d3.interpolateRgb);

// ─── Load data ──────────────────────────────────────────────────────
async function loadGraph() {
  const r = await fetch('/api/graph');
  graphData = await r.json();
}
async function loadBlast() {
  const r = await fetch('/api/blast');
  blastData = await r.json();
}

// ─── Dependency Graph ────────────────────────────────────────────────
let sim = null;
function renderGraph() {
  document.getElementById('loading').classList.remove('hidden');
  const el = document.getElementById('viz');
  el.innerHTML = '<svg></svg>';
  const svg = d3.select(el).select('svg');
  const w = el.clientWidth, h = el.clientHeight;

  const { nodes, edges } = graphData;
  if (!nodes.length) { document.getElementById('loading').textContent = 'No graph data'; return; }

  // Build node lookup
  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);

  const linkData = edges.filter(e => nodeMap[e.source] && nodeMap[e.target]);
  const nodeData = nodes.map(n => ({ ...n }));

  sim = d3.forceSimulation(nodeData)
    .force('link', d3.forceLink(linkData).id(d => d.id).distance(80))
    .force('charge', d3.forceManyBody().strength(-300))
    .force('center', d3.forceCenter(w / 2, h / 2))
    .force('collision', d3.forceCollide().radius(d => Math.max(8, Math.sqrt(d.loc || 1) * 2)));

  const link = svg.append('g')
    .selectAll('line')
    .data(linkData)
    .join('line')
    .attr('class', 'link')
    .attr('stroke-width', d => d.type === 'calls' ? 1.5 : 1);

  const node = svg.append('g')
    .selectAll('g')
    .data(nodeData)
    .join('g')
    .attr('class', 'node')
    .call(drag(sim))
    .on('click', (e, d) => selectNode(d.id))
    .on('mouseenter', (e, d) => showTooltip(e, `${d.name}\n${d.file}\nRisk: ${d.risk}  Score: ${d.blast_score.toFixed(1)}`))
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  node.append('circle')
    .attr('r', d => Math.max(5, Math.sqrt(d.loc || 1) * 1.5))
    .attr('fill', d => riskColor(d.blast_score));

  node.append('text')
    .attr('class', 'node-label')
    .attr('dx', d => Math.max(5, Math.sqrt(d.loc || 1) * 1.5) + 3)
    .attr('dy', 4)
    .text(d => d.name.length > 20 ? d.name.slice(0, 18) + '..' : d.name);

  sim.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  document.getElementById('loading').classList.add('hidden');
}

function drag(simulation) {
  function dragstart(e) { if (!e.active) simulation.alphaTarget(0.3).restart(); e.subject.fx = e.subject.x; e.subject.fy = e.subject.y; }
  function drag(e) { e.subject.fx = e.x; e.subject.fy = e.y; }
  function dragend(e) { if (!e.active) simulation.alphaTarget(0); e.subject.fx = null; e.subject.fy = null; }
  return d3.drag().on('start', dragstart).on('drag', drag).on('end', dragend);
}

// ─── Blast Heatmap ──────────────────────────────────────────────────
function renderHeatmap() {
  document.getElementById('loading').classList.remove('hidden');
  const el = document.getElementById('viz');
  el.innerHTML = '<svg></svg>';
  const svg = d3.select(el).select('svg');
  const w = el.clientWidth, h = el.clientHeight;

  if (!blastData.length) { document.getElementById('loading').textContent = 'No blast data'; return; }

  // Build tree from file paths
  function buildTree(items) {
    const root = { name: '/', children: [] };
    items.forEach(item => {
      const parts = (item.file_path || '').split('/').filter(Boolean);
      let cur = root;
      for (let i = 0; i < parts.length; i++) {
        const isFile = i === parts.length - 1;
        let child = cur.children.find(c => c.name === parts[i]);
        if (!child) {
          child = { name: parts[i], children: [], value: 1, file_path: item.file_path, blast_score: item.blast_score, risk_level: item.risk_level };
          cur.children.push(child);
        }
        if (isFile) {
          child.blast_score = item.blast_score;
          child.risk_level = item.risk_level;
          child.file_path = item.file_path;
          child.value = Math.max(item.blast_score, 1);
        }
        cur = child;
      }
    });
    return root;
  }

  const treeData = buildTree(blastData);
  const root = d3.hierarchy(treeData).sum(d => d.value || 1);
  const treeLayout = d3.tree().size([h - 60, w - 160]);
  treeLayout(root);

  svg.append('g').attr('transform', 'translate(40,20)')
    .selectAll('line')
    .data(root.links())
    .join('line')
    .attr('class', 'link')
    .attr('x1', d => d.source.y).attr('y1', d => d.source.x)
    .attr('x2', d => d.target.y).attr('y2', d => d.target.x);

  const g = svg.append('g').attr('transform', 'translate(40,20)')
    .selectAll('g')
    .data(root.descendants().filter(d => d.depth > 0))
    .join('g')
    .attr('transform', d => `translate(${d.y},${d.x})`)
    .on('click', (e, d) => { if (d.data.file_path) selectNode(d.data.file_path); })
    .on('mouseenter', (e, d) => showTooltip(e, `${d.data.name}\nScore: ${d.data.blast_score?.toFixed(1) || 'N/A'}\nRisk: ${d.data.risk_level || 'N/A'}`))
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  g.append('rect')
    .attr('class', 'heatmap-rect')
    .attr('x', -6).attr('y', -10).attr('width', 12).attr('height', 20)
    .attr('fill', d => riskColor(d.data.blast_score || 0));

  g.append('text')
    .attr('class', 'heatmap-label')
    .attr('dx', 12).attr('dy', 4)
    .text(d => d.data.name);

  document.getElementById('loading').classList.add('hidden');
}

// ─── Module Treemap ─────────────────────────────────────────────────
function renderTreemap() {
  document.getElementById('loading').classList.remove('hidden');
  const el = document.getElementById('viz');
  el.innerHTML = '<svg></svg>';
  const svg = d3.select(el).select('svg');
  const w = el.clientWidth, h = el.clientHeight;

  if (!blastData.length) { document.getElementById('loading').textContent = 'No graph data'; return; }

  const root = d3.hierarchy({ children: blastData.map(d => ({
    name: (d.file_path || '').split('/').pop() || d.file_path,
    file_path: d.file_path,
    blast_score: d.blast_score,
    risk_level: d.risk_level,
    value: Math.max(d.blast_score, 1)
  })) }).sum(d => d.value || 1);

  d3.treemap().size([w - 10, h - 10]).padding(2)(root);

  const cell = svg.append('g').attr('transform', 'translate(5,5)')
    .selectAll('g')
    .data(root.leaves())
    .join('g')
    .attr('transform', d => `translate(${d.x0},${d.y0})`)
    .on('click', (e, d) => { if (d.data.file_path) selectNode(d.data.file_path); })
    .on('mouseenter', (e, d) => showTooltip(e, `${d.data.name}\nScore: ${d.data.blast_score?.toFixed(1) || 'N/A'}\nRisk: ${d.data.risk_level || 'N/A'}`))
    .on('mousemove', moveTooltip)
    .on('mouseleave', hideTooltip);

  cell.append('rect')
    .attr('class', 'treemap-cell')
    .attr('width', d => Math.max(0, d.x1 - d.x0))
    .attr('height', d => Math.max(0, d.y1 - d.y0))
    .attr('fill', d => riskColor(d.data.blast_score || 0));

  cell.append('text')
    .attr('class', 'treemap-label')
    .attr('x', 4).attr('y', 14)
    .text(d => d.data.name.length > Math.max(5, (d.x1 - d.x0) / 7) ? d.data.name.slice(0, Math.max(3, (d.x1 - d.x0) / 7)) : d.data.name);

  document.getElementById('loading').classList.add('hidden');
}

// ─── Panel ──────────────────────────────────────────────────────────
async function selectNode(id) {
  selectedNodeId = id;
  const node = document.getElementById('panel');
  const title = document.getElementById('panel-title');
  const content = document.getElementById('panel-content');
  node.style.display = 'block';

  // Find in graph data
  const gNode = graphData.nodes.find(n => n.id === id || n.file === id);
  if (gNode) {
    title.textContent = gNode.name || gNode.file;
    content.innerHTML = `
      <p><strong>File:</strong> ${gNode.file}</p>
      <p><strong>Risk:</strong> ${gNode.risk} &nbsp; <strong>Score:</strong> ${gNode.blast_score?.toFixed(1)}</p>
      <p><strong>LOC:</strong> ${gNode.loc || 'N/A'}</p>
      <hr style="border-color:#30363d;margin:0.5rem 0">
      <p><strong>Symbols</strong></p>
      <div id="symbols-list">Loading...</div>
    `;
    // Fetch symbols
    try {
      const r = await fetch(`/api/symbols/${encodeURIComponent(gNode.file)}`);
      const symbols = await r.json();
      const sl = document.getElementById('symbols-list');
      sl.innerHTML = symbols.map(s => `<div class="sym"><span class="kind">${s.kind}</span>${s.name} <span style="color:#8b949e;font-size:0.75rem">line ${s.line}</span></div>`).join('');
    } catch { document.getElementById('symbols-list').textContent = 'Error loading symbols'; }
  } else {
    title.textContent = id;
    content.innerHTML = '<p>No detail available</p>';
  }
}

// ─── Tooltip ────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
function showTooltip(e, text) { tooltip.textContent = text; tooltip.style.opacity = 1; moveTooltip(e); }
function moveTooltip(e) { tooltip.style.left = (e.pageX + 12) + 'px'; tooltip.style.top = (e.pageY - 28) + 'px'; }
function hideTooltip() { tooltip.style.opacity = 0; }

// ─── Tab switching ──────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;
    if (sim) { sim.stop(); sim = null; }
    if (currentView === 'graph') renderGraph();
    else if (currentView === 'heatmap') renderHeatmap();
    else renderTreemap();
  });
});

// ─── Init ────────────────────────────────────────────────────────────
(async () => {
  await Promise.all([loadGraph(), loadBlast()]);
  renderGraph();
})();
</script>
</body>
</html>
