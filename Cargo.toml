[package]
name = "hermes-engine"
version = "0.1.0"
edition = "2021"
description = "Rust-native knowledge engine with pointer-based RAG, hybrid search, and temporal truth"

[[bin]]
name = "hermes"
path = "src/bin/hermes/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1.0"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
memchr = "2"
rayon = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1.0", features = ["full"] }
regex = "1.10"
notify = "6"
strsim = "0.11"
tempfile = "3"
fs2 = "0.4"
qdrant-client = { version = "1", default-features = false }
tiny_http = "0.12"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
shared-rust = { path = "../../ChartApp/shared-rust" }

[features]
default = ["ast"]
ast = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-typescript", "dep:tree-sitter-python"]

[dependencies.tree-sitter]
version = "0.25"
optional = true

[dependencies.tree-sitter-rust]
version = "0.24"
optional = true

[dependencies.tree-sitter-typescript]
version = "0.23"
optional = true

[dependencies.tree-sitter-python]
version = "0.25"
optional = true

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
