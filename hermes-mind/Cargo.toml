[package]
name = "hermes-mind"
version = "0.1.0"
edition = "2021"
description = "Personal knowledge connector for hermes — WhatsApp, Gmail, OneDrive, Telegram"

[[bin]]
name = "hermes-mind"
path = "src/main.rs"

[dependencies]
hermes-engine = { path = ".." }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
